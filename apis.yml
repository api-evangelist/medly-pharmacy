aid: medly-pharmacy
name: Medly Pharmacy
description: >-
  Medly Pharmacy (Medly Health Inc.) was a Brooklyn, New York digital pharmacy founded in 2017 by
  Marg Patel, a second-generation pharmacist. It operated a hybrid model — physical retail pharmacy
  locations paired with free same-day prescription delivery — supported by a consumer mobile app for
  refills, prescription status and pharmacist chat, and a prescriber-facing e-prescribing workflow it
  marketed to physician practices. The company raised a $100M Series B in July 2020, expanded into
  several US metros, and in 2021 acquired the health-and-wellness retailer Pharmaca. It never
  published a developer program, public API, SDK, machine-readable specification or partner
  integration reference; the platform was an internal product, not a product sold to developers.
  Medly Health filed for Chapter 11 bankruptcy on 9 December 2022 along with 31 affiliates, agreed on
  9 February 2023 to sell its remaining prescription files, inventory and intellectual property to
  Walgreens for $19.35M, wound down all retail and e-commerce operations by 31 March 2023, and
  converted to a Chapter 7 liquidation on 26 April 2023. In September 2024 the SEC charged three
  former executives, including the founder, in connection with the company's capital raises. The
  medly.com domain is now controlled by the acquirer and blanket-redirects every path to
  walgreens.com. What survives publicly is the company's engineering open source — the GitHub `medly`
  organization and its npm and Maven Central packages — none of which is an API client. This profile
  is retained as a historical record; there is no API surface to enrich.
