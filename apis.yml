  resolve via wildcard DNS to 165.160.13.20 / 165.160.15.20 and answer HTTP 301 with
  `Location: https://www.walgreens.com/` on EVERY path, including all /.well-known/* and every spec
  path. Port 443 has no listener — every HTTPS request times out. There is no Medly-served document
  at any of those URLs, so no Website, WellKnown, SecurityTxt, LLMsTxt, AgentCard or contract pointer
  is emitted from them. See well-known/medly-pharmacy-well-known.yml.
