description: >-
  Negative probe record for Medly Pharmacy (Medly Health Inc.). The company converted to a Chapter 7
  liquidation on 2023-04-26 after selling its prescription files, inventory and intellectual property
  to Walgreens. Its former host medly.com is now controlled by the acquirer: port 443 has no listener
  (every HTTPS request times out at the TCP layer) and port 80 answers HTTP 301 with
  `Location: https://www.walgreens.com/` for EVERY path, including every /.well-known/* path and
  every specification path. Not one of those responses is a document. No WellKnown, SecurityTxt,
  AgentCard, LLMsTxt, OpenAPI, AsyncAPI, MCPServer or GraphQL pointer is emitted from this probe, and
  none should ever be emitted from it in a later round.

