name: Medly Pharmacy published packages
description: >-
  First-party packages published by Medly (Medly Health Inc.) to npm, Maven Central and the Gradle
  Plugin Portal from its `medly` GitHub organization. READ THIS FIRST: none of these is an API client
  SDK. Medly never published a public API, so there is nothing for a client library to wrap. What the
  company published is internal engineering open source — a React design system, a Kotlin data-access
  library, Gradle build plugins, a Micronaut code generator, and detekt/CI extensions. They are
  recorded here because they are real, first-party, dated and verifiable, and because their release
  dates are the only provider-published decay evidence this company still emits. No `SDKs` pointer is
  emitted in apis.yml for exactly this reason — sdk_count must not be credited from a design system.
api_client_sdks: 0
api_client_sdks_note: >-
  Zero. Confirmed by GitHub code search across both Medly organizations: no OpenAPI, AsyncAPI, GraphQL
  SDL, .proto or WSDL document exists, and no repository is an HTTP client for a medly.com service.

company_status_note: >-
  Medly Health Inc. converted to Chapter 7 liquidation on 2023-04-26. The npm design-system packages
  nonetheless carry release dates into 2024 and 2025, published under the same scope and repository by
  the original maintainers (GitHub org members kdabir, souro1212) under an MIT licence. Treat the
  post-2023 releases as community continuation of an abandoned corporate project, not as evidence the
  company is operating.

